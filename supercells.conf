[Rule]
DOMAIN-SUFFIX,supercell.com
DOMAIN-SUFFIX,store.supercell.com

[URL Rewrite]
# 商店主页强制跳转（示例）
^https:\/\/store\.supercell\.com\/(.*) https://store.supercell.com/$1 302

# 如果有地区参数，可改区（示例，把CN改US）
(?<=_region=)CN(?=&) US 307

[Script]
# 拦截商店 API（具体接口需抓包确认）
http-response ^https:\/\/store\.supercell\.com\/api\/.* script-path=https://your-script-url/supercell.js, requires-body=true, timeout=10, tag=Supercell去限制

[MITM]
hostname = *.supercell.com, store.supercell.com